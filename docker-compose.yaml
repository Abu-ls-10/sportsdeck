services:
  db:
    image: postgres:15-alpine
    container_name: sportsdeck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportsdeck
      POSTGRES_PASSWORD: sportsdeck
      POSTGRES_DB: sportsdeck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsdeck -d sportsdeck"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./sportsdeck-app
      dockerfile: Dockerfile
      args:
        # Must match how users open the app (Nginx on port 80 → http://localhost). Register the same OAuth callback URLs in GitHub/Google.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: sportsdeck-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./sportsdeck-app/.env
    environment:
      # Override host DB URL from .env (localhost) with the Docker service name
      DATABASE_URL: postgresql://sportsdeck:sportsdeck@db:5432/sportsdeck
      NODE_ENV: production
      # OAuth redirects and /auth/callback links must use the public origin (not :3000 inside the container)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: sportsdeck-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # Web UI for Postgres (same Docker network as db). Not started by default — use profile dev-tools.
  # Start: docker compose --profile dev-tools up -d
  # Open: http://localhost:8080 — System: PostgreSQL, Server: db, Username: sportsdeck, Password: sportsdeck, Database: sportsdeck
  adminer:
    image: adminer:latest
    container_name: sportsdeck-adminer
    profiles:
      - dev-tools
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data:
