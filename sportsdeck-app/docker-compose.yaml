# Stack: Postgres, Redis (REDIS_URL for app), Next.js app, nginx.
# App gets REDIS_URL from the host `.env` if set; otherwise redis://redis:6379.
services:
  db:
    image: postgres:15-alpine
    container_name: sportsdeck-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sportsdeck
      POSTGRES_PASSWORD: sportsdeck
      POSTGRES_DB: sportsdeck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsdeck -d sportsdeck"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sportsdeck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportsdeck-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sportsdeck:sportsdeck@db:5432/sportsdeck
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      SALT_ROUNDS: ${SALT_ROUNDS}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      X_AUTH_TOKEN: ${X_AUTH_TOKEN}
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: sportsdeck-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # Web UI for Postgres (same Docker network as db). Not started by default — use profile dev-tools.
  # Start: docker compose --profile dev-tools up -d
  # Open: http://localhost:8080 — System: PostgreSQL, Server: db, Username: sportsdeck, Password: sportsdeck, Database: sportsdeck
  adminer:
    image: adminer:latest
    container_name: sportsdeck-adminer
    profiles:
      - dev-tools
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data:
